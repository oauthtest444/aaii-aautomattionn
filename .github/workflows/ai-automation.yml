name: Aaii Buug Bounnty Aautomaationn

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Optional authorized target URL/domain for this manual run"
        required: false
        type: string
      resume:
        description: "Internal: preserve result/ and resume after an automatic restart"
        required: false
        default: "false"
        type: string
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-bug-bounty-automation
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      CHROME_DEBUG_PORT: "9222"
      CHROME_PROFILE_DIR: /tmp/chrome-mcp-profile
      CHROME_LOG_FILE: /tmp/chrome-mcp.log
      OPENCODE_MODEL: opencode/deepseek-v4.1-flash-free

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest branch state
        run: |
          set -euo pipefail
          git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Connect VPN
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${WIREGUARD_CONFIG:-}" ]; then
            echo "WIREGUARD_CONFIG secret not set; using the GitHub runner IP."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools resolvconf
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo wg-quick up wg0
          echo "VPN connected."
          echo "Egress IP: $(curl -fsS --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Restore cached Chrome package
        id: chrome-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrome-deb
          key: google-chrome-stable-deb-${{ runner.os }}-v1

      - name: Install headless Chrome
        run: |
          set -euo pipefail
          DEB="$HOME/.cache/chrome-deb/google-chrome-stable_current_amd64.deb"
          mkdir -p "$(dirname "$DEB")"
          if [ ! -s "$DEB" ]; then
            echo "Downloading Chrome package..."
            curl -fsSL -o "$DEB" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          else
            echo "Using cached Chrome package."
          fi
          sudo apt-get update -qq
          if ! sudo apt-get install -y "$DEB"; then
            echo "Cached package failed; downloading a fresh copy..."
            rm -f "$DEB"
            curl -fsSL -o "$DEB" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y "$DEB"
          fi
          google-chrome-stable --version

      - name: Install OpenCode
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 300 https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Check free model access
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP:-/tmp}/opencode-logs"
          NATIVE_LOG="$HOME/.local/share/opencode/log/opencode.log"
          ACCESS_NATIVE="$LOG_DIR/access-check-native.log"
          NATIVE_START=0
          mkdir -p "$LOG_DIR"
          if [ -f "$NATIVE_LOG" ]; then
            NATIVE_START=$(stat -c %s "$NATIVE_LOG" 2>/dev/null || echo 0)
          fi
          set +e
          timeout 60 opencode run \
            --model "$OPENCODE_MODEL" \
            --dir "$RUNNER_TEMP" \
            "Reply with exactly OK" </dev/null > "$LOG_DIR/access-check.log" 2>&1
          STATUS=$?
          set -e
          : > "$ACCESS_NATIVE"
          if [ -f "$NATIVE_LOG" ]; then
            tail -c +$((NATIVE_START + 1)) "$NATIVE_LOG" > "$ACCESS_NATIVE" 2>/dev/null || true
          fi
          if grep -qaiE 'free usage limit reached|usage limit reached' "$ACCESS_NATIVE" "$LOG_DIR/access-check.log"; then
            echo "::error::OpenCode free usage limit reached; no model calls can succeed until access is restored."
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::OpenCode access check did not complete (status=$STATUS); the agent will attempt recovery."
          fi

      - name: Prepare optional manual target
        if: github.event_name == 'workflow_dispatch' && inputs.target != ''
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGET_INPUT" > data/targets.txt
          echo "Manual target prepared for this run only."

      - name: Restore target for resumed run
        if: github.event_name == 'workflow_dispatch' && inputs.resume == 'true'
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_INPUT:-}" ]; then
            echo "Manual target takes precedence over the resumed target."
            exit 0
          fi
          if [ -s result/logs/targets.used.txt ]; then
            cp result/logs/targets.used.txt data/targets.txt
            echo "Restored previous target for resumed run."
          fi

      - name: Restore cached test-account auth headers
        uses: actions/cache/restore@v4
        with:
          path: creds/auth-headers.txt
          key: auth-headers-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            auth-headers-${{ github.ref_name }}-

      - name: Prepare target state and results
        env:
          RESUME_RUN: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          mkdir -p result/logs
          CURRENT_HASH="$(sha256sum data/targets.txt | awk '{print $1}')"
          PREVIOUS_HASH="$(cat result/logs/targets.sha256 2>/dev/null || true)"
          if [ "${RESUME_RUN:-}" = "true" ]; then
            DECISION="preserved"
            echo "Automatic resume; preserving previous results."
          elif [ -n "$PREVIOUS_HASH" ] && [ "$CURRENT_HASH" = "$PREVIOUS_HASH" ]; then
            DECISION="preserved"
            echo "Target unchanged; preserving previous results."
          else
            DECISION="reset"
            echo "Target changed or no prior target state; starting fresh."
            find result -mindepth 1 -maxdepth 1 ! -name '.gitkeep' ! -iname '*compaction*.md' -exec rm -rf {} +
          fi
          mkdir -p result/client-side result/server-side result/findings result/inventory result/logs
          rm -f result/BLOCKED.md
          TARGET_URL="$(grep -Eo 'https?://[^[:space:]`]+' data/targets.txt | head -1 || true)"
          if [ ! -s result/inventory/top-level-routes.md ]; then
            {
              echo "# Top-Level Route Inventory"
              echo
              echo "Target: ${TARGET_URL:-unknown}"
              echo
              echo "| Top-Level Route | Status | Sub-Routes | Summary |"
              echo "|---|---|---|---|"
              if [ -n "$TARGET_URL" ]; then
                printf '| %s | pending | 0 | Seeded by workflow; agent must test. |\n' "$TARGET_URL"
              fi
            } > result/inventory/top-level-routes.md
          fi
          if [ ! -s result/inventory/api-routes.md ]; then
            cat > result/inventory/api-routes.md <<'EOF'
          # API Route Inventory

          | Method | Path | Parent Top-Level Route | Auth | Status | Summary |
          |---|---|---|---|---|---|
          EOF
          fi
          if [ ! -f result/confirmed-vuln.txt ]; then
            cat > result/confirmed-vuln.txt <<'EOF'
          # Confirmed vulnerabilities only.
          # Do not add speculative issues, status codes, reflected strings, or accepted-but-inert fields.
          # Entry format: see skills/AGENT.md, Section 11.
          EOF
          fi
          printf '%s\n' "$CURRENT_HASH" > result/logs/targets.sha256
          cp data/targets.txt result/logs/targets.used.txt
          {
            echo "run_id=${GITHUB_RUN_ID:-local}"
            echo "event=${GITHUB_EVENT_NAME:-local}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target_hash=$CURRENT_HASH"
            echo "previous_hash=${PREVIOUS_HASH:-none}"
            echo "decision=$DECISION"
            echo "---"
          } >> result/logs/target-state.txt

      - name: Detect notification test
        id: notification_test
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if grep -qiE '^[[:space:]]*(TEST_NOTIFICATION[[:space:]]*[:=][[:space:]]*true|MODE[[:space:]]*[:=][[:space:]]*notification-test)[[:space:]]*$' data/targets.txt 2>/dev/null; then
            echo "test_mode=true" >> "$GITHUB_OUTPUT"
            echo "Notification test mode enabled; no target will be tested."
          else
            echo "test_mode=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create notification test marker
        if: steps.notification_test.outputs.test_mode == 'true'
        run: |
          set -euo pipefail
          cat > result/TEST-NOTIFICATION.md <<'EOF'
          # Automation notification test

          - Status: TEST ONLY
          - Target tested: none
          - Confirmed vulnerabilities: none
          - Purpose: verify the workflow and Discord notification path

          This run intentionally did not test any target and did not create a
          confirmed vulnerability.
          EOF
          echo "Created result/TEST-NOTIFICATION.md"

      - name: Start Chrome MCP and run agent
        id: agent
        if: steps.notification_test.outputs.test_mode != 'true'
        timeout-minutes: 340
        env:
          AGENT_IDLE_TIMEOUT_SECONDS: "30"
          AGENT_MAX_ATTEMPTS: "3"
          AGENT_MAX_RECOVERIES: "1"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash tools/chrome-mcp-start.sh

          AGENT_LOG_DIR="${RUNNER_TEMP:-/tmp}/opencode-logs"
          mkdir -p "$AGENT_LOG_DIR"
          LOG="$AGENT_LOG_DIR/opencode.log"
          NATIVE_LOG="$HOME/.local/share/opencode/log/opencode.log"
          NATIVE_LAST_OUTPUT="$AGENT_LOG_DIR/last-native-output.txt"
          NATIVE_START_SIZE=0
          : > "$LOG"
          : > "$NATIVE_LAST_OUTPUT"
          tail -n 0 -F "$LOG" &
          TAIL_PID=$!

          BASE_CMD="$(cat tools/cmd.txt)"
          MODEL="$(awk '{for (i=1;i<=NF;i++) if ($i=="--model") {print $(i+1); exit}}' tools/cmd.txt)"
          RESUME_PROMPT='The previous attempt stalled or exited before completion. Read skills/AGENT.md first, then result/SESSION_COMPACTION.md and any other result/*compaction*.md file, result/inventory/top-level-routes.md, result/inventory/api-routes.md, result/inventory/subdomains.md, result/SUMMARY.md, and creds/auth-headers.txt. Resume the authorized scan from unfinished pending or progress work. Do not repeat completed work. Do not ask questions. Keep result/SESSION_COMPACTION.md updated with findings and next steps. Checkpoint confirmed findings immediately and continue until SCAN_COMPLETE is written.'
          QUESTION_RESPONSE='I am using you in an automated workflow, so do not ask me questions or wait for my response. Think like an experienced bug bounty hunter. Independently investigate the application, determine what needs to be done, make reasonable decisions, and continue the security testing. Do not stop. Start or resume the scan.'
          if [ -n "$MODEL" ]; then
            RESUME_CMD="opencode run --continue --model $MODEL '$RESUME_PROMPT'"
            FRESH_CMD="opencode run --model $MODEL '$RESUME_PROMPT'"
            QUESTION_CMD="opencode run --continue --model $MODEL '$QUESTION_RESPONSE'"
          else
            RESUME_CMD="opencode run --continue '$RESUME_PROMPT'"
            FRESH_CMD="opencode run '$RESUME_PROMPT'"
            QUESTION_CMD="opencode run --continue '$QUESTION_RESPONSE'"
          fi

          RESTART_MARKER="${RUNNER_TEMP:-/tmp}/opencode-auto-restart-requested"
          DISPATCHED_MARKER="${RUNNER_TEMP:-/tmp}/opencode-auto-restart-dispatched"
          rm -f "$RESTART_MARKER" "$DISPATCHED_MARKER"
          MAX_ATTEMPTS="${AGENT_MAX_ATTEMPTS:-3}"
          MAX_RECOVERIES="${AGENT_MAX_RECOVERIES:-1}"
          IDLE_TIMEOUT="${AGENT_IDLE_TIMEOUT_SECONDS:-30}"
          RECOVERY=0
          ATTEMPT=1
          FINAL_STATUS=0
          COMPLETED=0
          QUOTA_EXHAUSTED=0
          QUOTA_RECOVERY=0
          QUESTION_RESPONSE_SENT=0
          RUN_START_SIZE=0
          RUN_LAST_SIZE=0
          RUN_STATUS=0
          WATCHDOG_KILLED=0
          QUESTION_PATTERN='(please (provide|confirm|clarify|choose|select|tell me)|could you (please )?(provide|confirm|clarify)|can you (please )?(provide|confirm|clarify)|do you want me to|would you like me to|should i (proceed|continue|test|scan)|which (route|target|subdomain|endpoint|should i)|need (your|more) (input|information|clarification|approval)|waiting for (your|user) (response|input|confirmation)|let me know (what|which|if|how)|i need you to (provide|confirm|clarify))'

          capture_since() {
            local start="$1"
            local native_start="$2"
            local size
            local native_size
            size=$(stat -c %s "$LOG" 2>/dev/null || echo 0)
            if [ "$size" -gt "$start" ]; then
              tail -c +$((start + 1)) "$LOG" > "$AGENT_LOG_DIR/last-attempt-output.txt" || true
            else
              : > "$AGENT_LOG_DIR/last-attempt-output.txt"
            fi
            if [ -f "$NATIVE_LOG" ]; then
              native_size=$(stat -c %s "$NATIVE_LOG" 2>/dev/null || echo 0)
              if [ "$native_size" -gt "$native_start" ]; then
                tail -c +$((native_start + 1)) "$NATIVE_LOG" > "$NATIVE_LAST_OUTPUT" 2>/dev/null || true
              else
                : > "$NATIVE_LAST_OUTPUT"
              fi
            fi
          }

          quota_exhausted() {
            local source
            source="$AGENT_LOG_DIR/last-attempt-output.txt"
            [ -s "$source" ] || return 1
            grep -qaiE 'free usage limit reached|usage limit reached' "$source" "$NATIVE_LAST_OUTPUT" 2>/dev/null
          }

          scan_complete() {
            local file
            [ -s result/SCAN_COMPLETE ] || return 1
            grep -qE '^status=completed$' result/SCAN_COMPLETE || return 1
            [ -s result/SESSION_COMPACTION.md ] || return 1
            for file in result/inventory/top-level-routes.md result/inventory/api-routes.md; do
              [ -s "$file" ] || return 1
              if grep -Eiq '(^[[:space:]]*(\*\*)?Status:?(\*\*)?[[:space:]]*(pending|progress)([[:space:]]|$))|(\|[[:space:]]*(pending|progress)[[:space:]]*\|)' "$file"; then
                return 1
              fi
            done
            grep -Eiq '(^|[|[:space:]])completed([|[:space:]]|$)' result/inventory/top-level-routes.md || return 1
            if [ -s result/inventory/subdomains.md ] && grep -Eiq '(^[[:space:]]*(\*\*)?Status:?(\*\*)?[[:space:]]*(pending|progress)([[:space:]]|$))|(\|[[:space:]]*(pending|progress)[[:space:]]*\|)' result/inventory/subdomains.md; then
              return 1
            fi
            return 0
          }

          request_restart() {
            [ -f "$DISPATCHED_MARKER" ] && return 0
            [ -n "${GITHUB_ACTIONS:-}" ] || return 0
            [ -n "${GH_REPO:-}" ] && [ -n "${BRANCH:-}" ] || return 0
            command -v gh >/dev/null 2>&1 || return 0
            if timeout 30 gh workflow run ai-automation.yml --repo "$GH_REPO" --ref "$BRANCH" -f resume=true >> "$LOG" 2>&1; then
              printf 'dispatched\n' > "$DISPATCHED_MARKER"
              echo "RESTART: dispatched a fresh workflow run." >> "$LOG"
            else
              echo "RESTART: immediate dispatch failed; the final trigger will retry." >> "$LOG"
            fi
          }

          if scan_complete; then
            COMPLETED=1
            echo "COMPLETE: a valid SCAN_COMPLETE marker already exists; skipping agent."
            kill "$TAIL_PID" 2>/dev/null || true
            exit 0
          fi

          run_agent() {
            local cmd="$1"
            local pid
            local last_size
            local last_change
            local now
            local size
            RUN_START_SIZE=$(stat -c %s "$LOG" 2>/dev/null || echo 0)
            NATIVE_START_SIZE=0
            if [ -f "$NATIVE_LOG" ]; then
              NATIVE_START_SIZE=$(stat -c %s "$NATIVE_LOG" 2>/dev/null || echo 0)
            fi
            last_size=$RUN_START_SIZE
            last_change=$(date +%s)
            WATCHDOG_KILLED=0
            set +e
            timeout --signal=TERM --kill-after=30 20160 bash -c "$cmd" </dev/null >>"$LOG" 2>&1 &
            pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              if [ ! -e "/proc/$pid" ] || [ "$(awk '{print $3}' "/proc/$pid/stat" 2>/dev/null)" = "Z" ]; then
                break
              fi
              sleep 5
              if [ ! -e "/proc/$pid" ] || [ "$(awk '{print $3}' "/proc/$pid/stat" 2>/dev/null)" = "Z" ]; then
                break
              fi
              size=$(stat -c %s "$LOG" 2>/dev/null || echo 0)
              now=$(date +%s)
              if [ "$size" -gt "$last_size" ]; then
                last_size=$size
                last_change=$now
              elif [ $((now - last_change)) -ge "$IDLE_TIMEOUT" ]; then
                WATCHDOG_KILLED=1
                {
                  echo
                  echo "WATCHDOG: no agent output for ${IDLE_TIMEOUT}s; terminating attempt $ATTEMPT."
                  echo "WATCHDOG: time=$(date -u +%Y-%m-%dT%H:%M:%SZ) log_bytes=$size"
                } >> "$LOG"
                pkill -TERM -f '(^|/)[o]pencode run' 2>/dev/null || true
                sleep 5
                pkill -KILL -f '(^|/)[o]pencode run' 2>/dev/null || true
                kill -TERM "$pid" 2>/dev/null || true
                sleep 2
                kill -KILL "$pid" 2>/dev/null || true
                request_restart
                break
              fi
            done
            wait "$pid"
            RUN_STATUS=$?
            set -e
            RUN_LAST_SIZE=$last_size
            return 0
          }

          reinstall_opencode() {
            local log
            local path
            local uninstall_status=0
            local probe_status=0
            log="$AGENT_LOG_DIR/opencode-reinstall-$(date -u +%Y%m%dT%H%M%SZ).log"
            {
              echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "reason=agent did not complete after attempts"
              echo "home=$HOME"
              echo "install_before=$(timeout 10 "$HOME/.opencode/bin/opencode" --version 2>&1 || true)"
              echo "paths_before:"
              timeout 10 "$HOME/.opencode/bin/opencode" debug paths 2>&1 || true
            } > "$log"
            if [ -x "$HOME/.opencode/bin/opencode" ]; then
              timeout 120 "$HOME/.opencode/bin/opencode" uninstall --force >> "$log" 2>&1 || uninstall_status=$?
            elif command -v opencode >/dev/null 2>&1; then
              timeout 120 opencode uninstall --force >> "$log" 2>&1 || uninstall_status=$?
            fi
            echo "uninstall_status=$uninstall_status" >> "$log"
            for path in "$HOME/.opencode/bin/opencode" "$HOME/.config/opencode" "$HOME/.local/share/opencode" "$HOME/.local/state/opencode" "$HOME/.cache/opencode" "$HOME/.local/bin/opencode"; do
              if [ -e "$path" ]; then
                echo "leftover_after_uninstall=$path" >> "$log"
              fi
            done
            if [ -e "$HOME/.opencode/bin/opencode" ]; then
              echo "removing_leftover_binary=$HOME/.opencode/bin/opencode" >> "$log"
              rm -f "$HOME/.opencode/bin/opencode" || true
              rmdir "$HOME/.opencode/bin" 2>/dev/null || true
            fi
            if [ -e "$HOME/.opencode/bin/opencode" ]; then
              echo "ERROR: could not remove the OpenCode binary" >> "$log"
              return 1
            fi
            if ! curl -fsSL --connect-timeout 10 --max-time 300 https://opencode.ai/install | bash >> "$log" 2>&1; then
              echo "ERROR: OpenCode installer failed" >> "$log"
              return 1
            fi
            export PATH="$HOME/.opencode/bin:$PATH"
            hash -r
            echo "install_after=$(timeout 10 "$HOME/.opencode/bin/opencode" --version 2>&1 || true)" >> "$log"
            echo "paths_after:" >> "$log"
            timeout 10 "$HOME/.opencode/bin/opencode" debug paths >> "$log" 2>&1 || true
            set +e
            timeout 60 "$HOME/.opencode/bin/opencode" run \
              --model "$OPENCODE_MODEL" \
              --dir "$RUNNER_TEMP" \
              "Reply with exactly OK" </dev/null >> "$log" 2>&1
            probe_status=$?
            set -e
            echo "fresh_install_probe_status=$probe_status" >> "$log"
            return 0
          }

          reinstall_opencode_npm() {
            local log
            local npm_bin
            local install_status=0
            log="$AGENT_LOG_DIR/opencode-npm-reinstall-$(date -u +%Y%m%dT%H%M%SZ).log"
            {
              echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "reason=OpenCode free usage limit reached"
              echo "command=npm uninstall -g opencode-ai"
            } > "$log"
            set +e
            timeout 300 npm uninstall -g opencode-ai >> "$log" 2>&1
            echo "command=npm install -g opencode-ai" >> "$log"
            timeout 300 npm install -g opencode-ai >> "$log" 2>&1
            install_status=$?
            set -e
            npm_bin="$(npm prefix -g 2>/dev/null || true)/bin"
            export PATH="$npm_bin:$HOME/.opencode/bin:$PATH"
            hash -r
            echo "install_status=$install_status" >> "$log"
            echo "npm_bin=$npm_bin" >> "$log"
            echo "opencode_path=$(command -v opencode 2>/dev/null || true)" >> "$log"
            if [ "$install_status" -ne 0 ] || ! command -v opencode >/dev/null 2>&1; then
              return 1
            fi
            timeout 10 opencode --version >> "$log" 2>&1 || return 1
            return 0
          }

          while :; do
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              if [ "$RECOVERY" -gt 0 ]; then
                CMD="$FRESH_CMD"
              elif [ "$ATTEMPT" -eq 1 ]; then
                CMD="$BASE_CMD"
              else
                CMD="$RESUME_CMD"
              fi
              {
                echo
                echo "===== AGENT ATTEMPT $ATTEMPT/$MAX_ATTEMPTS (recovery $RECOVERY/$MAX_RECOVERIES) ====="
              } >> "$LOG"

              run_agent "$CMD"
              STATUS=$RUN_STATUS
              capture_since "$RUN_START_SIZE" "$NATIVE_START_SIZE"

              if quota_exhausted; then
                QUOTA_EXHAUSTED=1
                FINAL_STATUS=1
                echo "QUOTA: OpenCode free usage limit reached; paid/authenticated access or quota reset is required." >> "$LOG"
                break
              fi

              if [ "$QUESTION_RESPONSE_SENT" -eq 0 ] && grep -qaiE "$QUESTION_PATTERN" "$AGENT_LOG_DIR/last-attempt-output.txt"; then
                QUESTION_RESPONSE_SENT=1
                {
                  echo
                  echo "QUESTION: agent output matched a clarification pattern; sending the automated continuation response."
                } >> "$LOG"
                printf '%s\n' "$QUESTION_RESPONSE" >> "$LOG"
                run_agent "$QUESTION_CMD"
                STATUS=$RUN_STATUS
                capture_since "$RUN_START_SIZE" "$NATIVE_START_SIZE"
                if quota_exhausted; then
                  QUOTA_EXHAUSTED=1
                  FINAL_STATUS=1
                  echo "QUOTA: OpenCode free usage limit reached; paid/authenticated access or quota reset is required." >> "$LOG"
                  break
                fi
              fi

              if [ "$WATCHDOG_KILLED" -eq 1 ]; then
                FINAL_STATUS=124
                {
                  echo "watchdog_terminated=true"
                  echo "watchdog_terminated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "last_log_bytes=$RUN_LAST_SIZE"
                  echo "attempts=$ATTEMPT"
                  echo "recovery=$RECOVERY"
                } >> "$AGENT_LOG_DIR/agent-watchdog.txt"
                if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                  echo "WATCHDOG: restarting agent (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)" >> "$LOG"
                  ATTEMPT=$((ATTEMPT + 1))
                  sleep 1
                  continue
                fi
                break
              fi

              if [ "$STATUS" -eq 0 ] && scan_complete; then
                COMPLETED=1
                FINAL_STATUS=0
                echo "COMPLETE: SCAN_COMPLETE and terminal inventory statuses verified." >> "$LOG"
                break
              fi

              if [ "$STATUS" -eq 0 ]; then
                FINAL_STATUS=1
                echo "INCOMPLETE: agent exited 0 without a valid SCAN_COMPLETE marker or with pending/progress inventory items." >> "$LOG"
              else
                FINAL_STATUS=$STATUS
                echo "Agent exited with status $STATUS." >> "$LOG"
              fi

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                echo "Restarting agent (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)" >> "$LOG"
                ATTEMPT=$((ATTEMPT + 1))
                sleep 1
                continue
              fi
              break
            done

            if [ "$COMPLETED" -eq 1 ] || [ "$QUOTA_EXHAUSTED" -eq 1 ]; then
              break
            fi

            if [ "$RECOVERY" -lt "$MAX_RECOVERIES" ] && [ "$QUOTA_RECOVERY" -eq 0 ]; then
              RECOVERY=$((RECOVERY + 1))
              echo "RECOVERY: performing supported OpenCode uninstall and fresh install ($RECOVERY/$MAX_RECOVERIES)." >> "$LOG"
              if reinstall_opencode; then
                echo "RECOVERY: fresh OpenCode installation complete; retrying testing from preserved result/ state." >> "$LOG"
                ATTEMPT=1
                MAX_ATTEMPTS=1
                FINAL_STATUS=0
                sleep 1
                continue
              fi
              echo "RECOVERY: supported OpenCode reinstall failed." >> "$LOG"
              FINAL_STATUS=1
            fi

            if [ "$QUOTA_EXHAUSTED" -eq 0 ]; then
              printf 'requested\n' > "$RESTART_MARKER"
              {
                echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "reason=no agent completion after retries and recovery"
                echo "run_id=${GITHUB_RUN_ID:-local}"
              } > "$AGENT_LOG_DIR/auto-restart.txt"
            fi
            break
          done

          if [ "$QUOTA_EXHAUSTED" -eq 1 ]; then
            cat > result/BLOCKED.md <<'EOF'
          # Scan blocked: OpenCode free usage limit

          OpenCode reported that the free usage limit was reached.

          - This is a server-side/account or network quota, not a local installation defect.
          - Reinstalling OpenCode does not restore access; use paid/authenticated access or wait for the quota to reset.
          - No automatic resume was requested.
          - No completion marker was written and no scan success is claimed.
          - Partial results, if any, were preserved.
          EOF
            echo "::error::OpenCode free usage limit reached; scan blocked until access is restored."
            FINAL_STATUS=1
          elif [ "$COMPLETED" -ne 1 ]; then
            printf 'requested\n' > "$RESTART_MARKER"
            echo "::error::Agent did not complete the authorized scan; an automatic resume run was requested."
            FINAL_STATUS=1
          fi

          kill "$TAIL_PID" 2>/dev/null || true
          exit "$FINAL_STATUS"

      - name: Ensure session compaction
        if: always()
        run: |
          set -euo pipefail
          mkdir -p result
          FILE=result/SESSION_COMPACTION.md
          TARGET="$(grep -Eo 'https?://[^[:space:]`]+' data/targets.txt 2>/dev/null | head -1 || true)"
          if [ ! -s "$FILE" ]; then
            cat > "$FILE" <<EOF
          # Session Compaction

          Status: incomplete
          Target: ${TARGET:-unknown}
          Run: ${GITHUB_RUN_ID:-local}

          ## Agent handoff

          The agent did not leave a session compaction before this workflow ended.
          Review result/BLOCKED.md, result/logs/, and the inventories, then resume
          from the first pending or progress item.

          ## Next workflow

          - Reconstruct discoveries from inventories and reports.
          - Check whether creds/auth-headers.txt contains valid account headers.
          - Continue unfinished routes and record new findings here.
          EOF
          fi
          {
            echo
            echo "## Workflow closeout"
            echo
            echo "- timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- run_id: ${GITHUB_RUN_ID:-local}"
            echo "- event: ${GITHUB_EVENT_NAME:-local}"
            echo "- agent_outcome: ${{ steps.agent.outcome }}"
            echo "- workflow_status: ${{ job.status }}"
            echo "- note: Agent-created compaction is authoritative; this closeout records how the run ended."
          } >> "$FILE"

      - name: Save test-account auth headers
        if: always() && hashFiles('creds/auth-headers.txt') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: creds/auth-headers.txt
          key: auth-headers-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect runtime diagnostics
        if: always()
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP:-/tmp}/opencode-logs"
          mkdir -p "$LOG_DIR"
          cp -f /tmp/chrome-mcp.log "$LOG_DIR/chrome-mcp.log" 2>/dev/null || true
          for dir in "$HOME/.local/share/opencode/log" "$HOME/.local/state/opencode/log" "$HOME/.opencode/log"; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f -name '*.log' -size -5M -exec cp -f {} "$LOG_DIR/" \; 2>/dev/null || true
            fi
          done
          find "$LOG_DIR" -maxdepth 2 -type f -printf '%f %s bytes\n' | sort > "$LOG_DIR/diagnostics-index.txt"

      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/opencode-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Finalize confirmed findings
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          conf = pathlib.Path("result/confirmed-vuln.txt")
          text = conf.read_text(errors="ignore") if conf.is_file() else ""
          additions = []
          warnings = []

          for report in sorted(pathlib.Path("result/findings").glob("*/report.md")):
              body = report.read_text(errors="ignore")
              status = re.search(r'(?im)^\s*[-*]?\s*\**Status:?\**\s*Confirmed\b', body)
              if not status:
                  continue

              finding_id = report.parent.name
              severity = re.search(
                  r'(?im)^\s*[-*]?\s*\**Severity:?\**\s*(Critical|High|Medium)\b',
                  body,
              )
              evidence = report.parent / "evidence"
              evidence_files = [
                  path for path in evidence.rglob("*") if path.is_file()
              ] if evidence.is_dir() else []

              if not evidence_files:
                  warnings.append(f"{finding_id}: confirmed report has no evidence files")
              if not severity:
                  warnings.append(f"{finding_id}: confirmed report has no severity")
                  continue

              level = severity.group(1)
              if level not in {"Critical", "High"}:
                  print(f"Skipping {finding_id}: severity {level}; fallback notifies Critical/High only")
                  continue
              if finding_id in text:
                  continue
              if not evidence_files:
                  continue

              title = body.splitlines()[0].lstrip("# ").strip()
              if title.startswith(finding_id):
                  title = title[len(finding_id):].lstrip(" —-")
              additions.append(
                  f"[{finding_id}] {title}\n"
                  f"Status: Confirmed\n"
                  f"Severity: {level}\n"
                  f"Evidence: {report.parent}/\n"
              )

          if additions:
              with conf.open("a", encoding="utf-8") as handle:
                  handle.write("\n" + "\n".join(additions))
              print(f"Added {len(additions)} high-severity confirmed finding(s) to confirmed-vuln.txt")
          else:
              print("No high-severity confirmed reports needed finalization.")

          if warnings:
              pathlib.Path("result/inventory/checkpoint-validation.txt").write_text(
                  "\n".join(warnings) + "\n", encoding="utf-8"
              )
              for warning in warnings:
                  print(f"::warning::{warning}")
          else:
              print("All confirmed reports have evidence and severity.")
          PY

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-scan-results-${{ github.run_id }}
          path: result/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean runtime-only files
        if: always()
        env:
          TARGET_INPUT: ${{ inputs.target }}
          RESUME_RUN: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_INPUT:-}" ] || [ "${RESUME_RUN:-}" = "true" ]; then
            if git ls-files --error-unmatch data/targets.txt >/dev/null 2>&1; then
              git checkout -- data/targets.txt
            else
              rm -f data/targets.txt
            fi
          fi
          rm -f opencode.json

      - name: Commit results
        id: commit_results
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- creds/)" ]; then
            echo "ERROR: creds/ changed; refusing to commit results." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A result
          if git diff --cached --name-only | grep -q '^creds/'; then
            echo "ERROR: creds/ would be committed; refusing to commit results." >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "scan: results $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Trigger automatic resume run
        if: always() && steps.commit_results.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MARKER="${RUNNER_TEMP:-/tmp}/opencode-auto-restart-requested"
          DISPATCHED="${RUNNER_TEMP:-/tmp}/opencode-auto-restart-dispatched"
          if [ -f "$DISPATCHED" ]; then
            echo "Automatic resume run was already dispatched."
            exit 0
          fi
          if [ ! -f "$MARKER" ]; then
            echo "No automatic restart requested."
            exit 0
          fi
          gh workflow run ai-automation.yml --repo "$GH_REPO" --ref "$BRANCH" -f resume=true
          printf 'dispatched\n' > "$DISPATCHED"
          echo "Dispatched automatic resume run."

      - name: Notify Discord on confirmed findings
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          TEST_MODE: ${{ steps.notification_test.outputs.test_mode }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          test_mode = os.environ.get("TEST_MODE") == "true"

          if test_mode:
              content = (
                  "**Automation test notification**\n"
                  "No vulnerability was tested or confirmed. "
                  "This message only verifies that the Discord notification path works.\n"
                  f"Repository: {os.environ.get('REPO', '')}\n"
                  f"Run: {os.environ.get('RUN_URL', '')}"
              )
          else:
              path = pathlib.Path("result/confirmed-vuln.txt")
              if not path.is_file():
                  print("No confirmed-vuln.txt; skipping Discord notification.")
                  raise SystemExit(0)

              text = path.read_text(errors="ignore")
              blocks = []
              for block in re.split(r"\n\s*\n", text):
                  lines = [line for line in block.splitlines() if line.strip()]
                  if not lines or lines[0].lstrip().startswith("#"):
                      continue
                  if not any(re.match(r"(?i)^\s*(\*\*)?Status:?\s*Confirmed\b", line) for line in lines):
                      continue
                  blocks.append(lines)

              if not blocks:
                  print("No confirmed findings; skipping Discord notification.")
                  raise SystemExit(0)

              selected = []
              for lines in blocks[:3]:
                  title = lines[0][:240]
                  asset = next((line for line in lines if re.match(r"(?i)^\s*(\*\*)?Asset:", line)), "")
                  kind = next((line for line in lines if re.match(r"(?i)^\s*(\*\*)?Type:", line)), "")
                  severity = next((line for line in lines if re.match(r"(?i)^\s*(\*\*)?Severity:", line)), "")
                  evidence = next((line for line in lines if re.match(r"(?i)^\s*(\*\*)?Evidence:", line)), "")
                  summary = "\n".join(part for part in (title, asset, kind, severity, evidence) if part)
                  selected.append(summary)
              findings = "\n\n".join(selected)
              content = (
                  "**Confirmed vulnerability found**\n"
                  f"Repository: {os.environ.get('REPO', '')}\n"
                  f"Run: {os.environ.get('RUN_URL', '')}\n"
                  f"{findings}"
              )[:1900]

          body = json.dumps({
              "content": content,
              "allowed_mentions": {"parse": []},
          }).encode()

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"Discord notification sent: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              print(f"Discord notification failed: HTTP {exc.code} {exc.reason}")
              try:
                  detail = exc.read().decode("utf-8", "replace")[:300]
                  print(f"Discord response: {detail or '<empty>'}")
              except Exception:
                  print("Discord response: <unreadable>")
              webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
              parsed = urllib.parse.urlparse(webhook)
              print(
                  f"Webhook host={parsed.hostname} "
                  f"path_prefix={parsed.path[:14]} length={len(webhook)}"
              )
          except Exception as exc:
              print(f"Discord notification failed: {type(exc).__name__}")
          PY
